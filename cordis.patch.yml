# Profile layer for dsh-review-panel.
#
# `dsh plugin --profile <p> add -w <path>` promotes this package into
# dsh.profile.bundles; this file is then composed as that bundle's layer.
#
# A row has exactly EIGHT legal keys:
#   id, name, config, group, disabled, inject   (loader EntryOptions)
#   intercept, isolate                          (added by the loader's isolate module)
# Nothing else is legal.
#   id        - stable, short, kebab-case. Later patch layers target THIS.
#   name      - the INSTALLED PACKAGE NAME plus sub-entry. Node must resolve it.
#   config    - every key is optional; the entry's Config schema supplies defaults.
#   inject    - EVERY entry is required and blocking. Never list a cordis core
#               member (logger, events, reflect, registry, fiber, root).
#
# Two entries, one bundle:
#   review-panel      - the ReviewPanel service (ctx.reviewPanel)
#   review-panel-web  - the JSON API behind the sidebar panel (web profile only)
- insert:
    - id: review-panel
      name: dsh-review-panel
      config:
        defaultBaseBranch: main
        maxPatchBytes: 524288
    - id: review-panel-web
      name: dsh-review-panel/web
      inject: [reviewPanel]
